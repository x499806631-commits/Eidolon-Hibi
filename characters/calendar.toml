[[holidays]]
name = "元旦"
icon = "🎍"
date = "01-01"
note = "新年的第一天，大家会互道新年快乐（あけましておめでとう），很多人去神社新年参拜（初詣）。"

[[holidays]]
name = "春节"
icon = "🧧"
dates = { 2025 = "01-29", 2026 = "02-17", 2027 = "02-06", 2028 = "01-26", 2029 = "02-13", 2030 = "02-03", 2031 = "01-23", 2032 = "02-11", 2033 = "01-31", 2034 = "02-19", 2035 = "02-08" }
note = "中国的农历新年，制作人那边会团聚、拜年、说「新年快乐」。"

[[holidays]]
