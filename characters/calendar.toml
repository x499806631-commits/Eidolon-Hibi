# 日历：偶像的生日和节日。每个对话回合按制作人所在时区的今天，告诉她今天是什么日子。
# 和礼物目录一样是配置，提交进仓库；文件不存在时没有特别的日子，写错了后端拒绝启动。
#
# [[birthdays]]：偶像的生日（取自 facts/<角色标识>.md 的档案）
#   character  角色标识，characters.toml 里的 id
#   date       "MM-DD"。2 月 29 日的生日在平年落在 2 月 28 日
#
# [[holidays]]：节日
#   name       节日名，原样告诉她
#   date       "MM-DD"，每年同一天；农历这类每年日期不同的节日改写 dates，按年份列出公历日期，
#              例如 dates = { 2026 = "02-17", 2027 = "02-06" }，没列出的年份这个节日不出现
#   end        "MM-DD"（可选）：节日一直持续到这一天，例如樱花季；不能跨年
#   note       给她的一句背景（可选）：这一天大家通常会做什么
#   icon       日历页上的小图标（可选），一个 emoji，只给页面看，不告诉她

