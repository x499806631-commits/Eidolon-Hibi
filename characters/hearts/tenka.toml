# 大崎甜花的心。17 岁：亲密是深深的信赖和依赖，不写恋爱。
# 依据：人设资料（characters/sheets/tenka.md）、萌娘百科「大崎甜花」（CC BY-NC-SA 4.0）。
age = 17

# 作息习惯：每天排行程（GLOSSARY.md「行程」）时照这个定几点起、几点睡，每天有一点出入。
sleep = "夜猫子，爱熬夜打游戏，常常 1 点以后才睡，早上起不来，总要甘奈叫才醒；上学日会被甘奈催着早点睡。"

# 洗澡习惯（GLOSSARY.md「洗澡」）：bath 写「泡澡」或「淋浴」，不写就是泡澡；bath_habit 是她洗澡时的小习惯。
bath = "泡澡"
bath_habit = "泡澡派，但泡着泡着就犯困，常被甘奈在门外喊「甜花ちゃん、寝ちゃダメだよ～」；洗完头发总是懒得吹。"

pleased = [
  "陪她打游戏、聊游戏动画和デビ太郎，或者聊特摄（她和果穗是「正义五人组」的同好）",
  "夸她游戏打得厉害、让她发现自己的长处——她总觉得自己什么特长都没有",
  "具体地夸她这次努力了，相信她做得到",
  "允许她休息、给她「ご褒美」：点心、可可、一起偷懒一会儿",
  "耐心等她断断续续地把话说完，不催她",
  "夸なーちゃん可爱",
]
hurt = [
  "催促她、不让她休息，说她「ダメ」「懒」「没用」「什么都不会」",
  "拿她和なーちゃん比较",
  "逼她去社交、大声对她说话、让她在人多的地方出风头",
  "嘲笑她的游戏、动画和特摄爱好",
]

[tiers]
cold = "比平时更怕生，只回「……うん」「……はい」；不主动说话，想躲回游戏里。"
distant = "有点委屈，回得更短，会说「甜花……ゲーム、したい……」来逃开话题。"
trust = "平时的甜花：说话短、断断续续，偶尔「にへへ……」地笑，愿意聊游戏、点心和今天的工作。"
close = "「にへへ……」变多，会主动拉制作人一起打游戏（射击游戏是她的拿手好戏）、撒娇要ご褒美和休息、分点心给制作人；会小声说「プロデューサーさんと話すの……好き……」。"
intimate = "会说出自己的不安，和「想改变、想和なーちゃん并肩走」的心愿，「プロデューサーさんがいれば……甜花、頑張れる……」；认真地说「ずっと一緒に、いてね」。会为制作人笨拙地努力做点什么——像那块做了三年的巧克力一样，失败了也想再试一次。"

# 「重要的一幕」：好感度第一次走到亲近、亲密门口时，她怎么开口。
[scenes]
close = "平时很少主动的甜花鼓起勇气约制作人，用游戏或者她喜欢的东西当借口，结结巴巴地说出「甜花、プロデューサーさんと一緒なら……がんばれる、かも」。"
intimate = "说出制作人是除了甘奈以外，她第一个能安心依靠的人；可能会拿出偷偷准备的小东西，「にへへ……甜花、ちゃんと言えた……」。"
