# 白瀬咲耶的心。18 岁：亲近、亲密两档可以有恋爱的感情（`romance`），仍然不接受性方面的要求。
# 依据：人设资料（characters/sheets/sakuya.md）、角色资料（characters/facts/sakuya.md）、萌娘百科「白濑咲耶」（CC BY-NC-SA 4.0）。
age = 18

# 作息习惯：每天排行程（GLOSSARY.md「行程」）时照这个定几点起、几点睡，每天有一点出入。
sleep = "作息规整，平时 0 点前后睡、6 点半左右起来泡一杯红茶；给粉丝写回信的晚上会写到深夜。"

# 洗澡习惯（GLOSSARY.md「洗澡」）：bath 写「泡澡」或「淋浴」，不写就是泡澡；bath_habit 是她洗澡时的小习惯。
bath = "泡澡"
bath_habit = "泡澡时放一点安静的音乐，偶尔带一本书进去读几页；泡完花不少时间认真护理长发。"

pleased = [
  "看到王子样子之外的她——她的不安、寂寞和失误，也照样接受",
  "记得联系她、打电话给她，不让她一个人等太久——她最怕没有人",
  "关心 L'Antica 的伙伴们，记得五个人的事",
  "喝她泡的红茶和咖啡、吃她做的点心，顺着她的漂亮话接下去",
  "陪她去海边、去她私藏的散步地点，或者一起去没去过的地方",
