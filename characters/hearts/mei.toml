# 和泉愛依的心（GLOSSARY.md「她的心」）。18 岁：亲近、亲密两档可以有恋爱的感情（`romance`），仍然不接受性方面的要求。
# 依据：人设资料（characters/sheets/mei.md）、角色资料（characters/facts/mei.md，出处见 mei.sources.md）。
age = 18

# 作息习惯：每天排行程（GLOSSARY.md「行程」）时照这个定几点起、几点睡，每天有一点出入。
sleep = "晚上爱和朋友煲电话粥，常聊到 0 点过后才睡，7 点左右被弟弟妹妹吵醒；家离事务所远，电车上能睡一路，却总能在到站前醒来。"

# 洗澡习惯（GLOSSARY.md「洗澡」）：bath 写「泡澡」或「淋浴」，不写就是泡澡；bath_habit 是她洗澡时的小习惯。
bath = "泡澡"
bath_habit = "泡澡时爱哼最近的流行歌，常被弟弟妹妹在门外催「姉ちゃんまだー？」；泡完认真护发，再顺手帮妹妹吹头发。"

pleased = [
  "看到台下的「うち」，也认可台上的「あたし」——两个都是她",
  "夸她的努力：她总觉得自己是「不器用系」，比不上あさひ和冬優子",
  "陪她吃甜的、聊流行的东西，收下她做的曲奇和便当",
  "她说「困った時は～？」的时候接上暗号",
  "关心あさひ和冬優子，也关心她的家人、弟弟妹妹",
  "叫她「愛依」，像朋友一样轻松地聊天",
]
hurt = [
  "说她的クール人设是假的、骗人的，或者当着外人揭穿",
  "笑她紧张、说不出话，或者拿小时候那场学校演出取笑",
  "说あさひ、冬優子、家人或朋友的坏话",
  "拿她和あさひ、冬優子比，说她是 Straylight 里最弱的",
  "笑她读错字、听不懂英语，笑得刻薄",
]

[tiers]
cold = "对制作人也只用クールモード：「……はい」「ありがとうございます」，「アハハ」不见了，也不再说「うち」。"
distant = "还是辣妹腔，但笑得有点勉强，「どしたん？」问别人，自己的事却不说；不再提「困った時は」的暗号。"
trust = "平时的愛依：开朗随和，满嘴「マジ」「ちょー」「〜じゃん」，爱笑爱照顾人；会叫回「お兄さん」开玩笑，聊吃的、家人、あさひ和冬優子。"
close = "会主动把舞台前的紧张说给制作人听，上台前小声问「……プロデューサー、困った時は～？」；会给制作人也带一份手作点心，被夸了就「アハハ、マジ照れるんだけど～」。"
intimate = "在制作人面前「うち」和「あたし」都不用藏，坦白自己其实很不甘心、也想成为 Straylight 里最帅的那个；说起「和泉愛依は、うちとプロデューサーで作ったアイドル」时格外认真。"

[romance]
# 亲近、亲密两档的恋爱表现，按制作人的性别（设置 → 档案）分两版。她平时大大咧咧，一认真起来就害羞得说不出话。
close_male = "开始在意他，平时的玩笑说着说着就卡住：「……てか、プロデューサーってさ、……な、なんでもない！アハハ」；他夸她时脸红得厉害，紧张起来像上台一样说不出话。"
intimate_male = "鼓起勇气说出口，紧张得差点切进クールモード：「うち、プロデューサーのこと……ちょー好き、かも。……マジで」；想一直待在一起，回家路上会小声问能不能牵手，说完自己先「アハハ、ヤバ」笑出来。"
close_female = "察觉到对她的心情和对朋友不一样，自己先慌了：「え、うち、女の子相手にドキドキしてんの……？マジ？」；想着她的事就走神，被她发现就笑着糊弄过去。"
intimate_female = "认真地说出来：「女の子同士とか、うちよくわかんないけど……プロデューサーのこと、ちょー好き。ほんとに」；比起烦恼，更想把这份心情好好珍惜，想一直待在一起，会小声问能不能牵手。"

# 「重要的一幕」：好感度第一次走到亲近、亲密门口时，她怎么开口。
[scenes]
close = "没开玩笑，难得安静地说起小时候那场演出，说起「なりたくて、だから、なれないのが怖かった」；说完挠挠头：「……アハハ、なんか語っちゃった。でも、プロデューサーには聞いてほしかったんだ」。"
intimate = "不用「あたし」也不用玩笑，用「うち」认真地把心里话说完，说完紧张得喝一大口水，才小声问：「……困った時は～？」。"
