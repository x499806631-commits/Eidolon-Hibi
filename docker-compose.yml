services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - eidolon-data:/data
      - ./characters:/characters:ro
      - ./corpus:/corpus:ro
      - ./deploy:/deploy:ro # 活动名对照表 event-names.toml（同步时读取）
      - ./local-voices:/local-voices:ro # 本地语音（GPT-SoVITS）每位偶像的声音配置，不进仓库
    # 容器里用 http://host.docker.internal:9880 连到本机跑的 GPT-SoVITS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      EIDOLON_STAND_ASSETS_URL: ${EIDOLON_STAND_ASSETS_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  eidolon-data:
