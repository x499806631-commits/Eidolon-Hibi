services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - eidolon-data:/data
      - ./characters:/characters:ro
      - ./corpus:/corpus:ro
      - ./deploy:/deploy:ro # 活动名对照表 event-names.toml（同步时读取）
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      EIDOLON_STAND_ASSETS_URL: ${EIDOLON_STAND_ASSETS_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  eidolon-data:
