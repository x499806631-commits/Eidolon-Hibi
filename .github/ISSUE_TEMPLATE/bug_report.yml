name: 问题反馈
description: 某个功能不正常、报错或和文档说的不一样
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        贴日志和配置前，请删掉 API key、token、OAuth secret、`EIDOLON_SECRET_KEY` 等密钥，以及别人的对话内容。
        术语见 [GLOSSARY.md](https://github.com/Sallyn0225/eidolon-sc/blob/main/GLOSSARY.md)。

  - type: checkboxes
    id: searched
    attributes:
      label: 已有的 issue
      options:
        - label: 我在[已有的 issue](https://github.com/Sallyn0225/eidolon-sc/issues?q=is%3Aissue)（含已关闭的）里搜过，没有一样的
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的地方
      multiple: true
      options:
        - 文字聊天
        - 语音通话（WebRTC / 语音识别 / 语音合成）
        - 立绘（Spine、表情、衣装）
        - 回忆剧情（检索、判断模型）
        - 记忆
        - 登录与用户（OAuth、限流、删除数据）
        - 自带密钥
        - 剧情库 / 世界设定同步（eidolon story sync、world sync）
        - 部署（Docker Compose、Caddy、coturn、备份）
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际看到的现象；有报错就贴报错原文
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的结果
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 和哪个角色、说了什么、点了什么；偶发的请写大概多久出现一次
      placeholder: |
        1. 登录后打开櫻木真乃的对话页
        2. 打电话，说「……」
        3. ……
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - 公网部署（docker-compose.prod.yml）
        - 本地 Docker Compose（docker-compose.yml）
        - 本地开发（uv run / npm run dev）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 提交哈希或镜像标签（EIDOLON_IMAGE_TAG，如 main、sha-xxxxxxx、1.2.3）
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 相关配置
      description: 只写和问题有关的项，不要贴密钥
      placeholder: |
        CHAT_LLM_PROTOCOL=…  CHAT_LLM_MODEL=…
        JUDGE_PROVIDER=…
        EMBEDDING_PROVIDER=…
        STT_PROVIDER=…
        是否在用自带密钥：…
        浏览器 / 系统：…
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 后端日志（docker compose logs backend）、浏览器控制台等
      render: text
