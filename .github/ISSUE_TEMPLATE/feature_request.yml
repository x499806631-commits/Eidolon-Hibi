name: 功能建议
description: 对现有功能的改进；想要新玩法请用「玩法仓库登记」
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **想要新玩法？** 主仓库的玩法主要做维护者自己想做的，别人提的玩法需求基本不在这里做。请 fork 一份、改个名字，在自己的仓库里做出来，再用 [玩法仓库登记](https://github.com/Sallyn0225/eidolon-sc/issues/new?template=fork_showcase.yml) 模板登记，会收进 [社区玩法仓库](https://github.com/Sallyn0225/eidolon-sc/blob/main/docs/community-forks.md)。

        动手前会先在 `.scratch/<feature>/` 写 spec 和 ticket；涉及已有设计决策的，请先看看 [docs/adr/](https://github.com/Sallyn0225/eidolon-sc/tree/main/docs/adr)。

  - type: checkboxes
    id: searched
    attributes:
      label: 已有的 issue
      options:
        - label: 我在[已有的 issue](https://github.com/Sallyn0225/eidolon-sc/issues?q=is%3Aissue)（含已关闭的）里搜过，没有一样的
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在用起来哪里不方便、缺了什么；用制作人或部署者的视角描述
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
      description: 希望它怎么表现；有参考的界面或原作场景可以附图
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
      description: 不选它们的原因

  - type: input
    id: related-adr
    attributes:
      label: 相关的 ADR
      description: 会改变或依赖哪条 ADR，如 ADR-0002；没有就留空
