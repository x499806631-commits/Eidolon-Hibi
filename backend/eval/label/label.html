<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>判断模型 eval 标注</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --ink: #1f1f1f; --muted: #6b6b6b; --line: #e3e1dc;
    --accent: #3b5bdb; --warn: #c2410c; --ok: #15803d; --she: #f1efe9; --me: #e7ecfb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 120px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 16px; }
  header h1 { font-size: 16px; margin: 0; margin-right: auto; }
  button, select { font: inherit; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: inherit; }
  button:hover { border-color: #bbb; }
  button:disabled { opacity: .4; cursor: default; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .who { font-weight: 600; font-size: 17px; }
  .history { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; }
  .msg.she { background: var(--she); align-self: flex-start; }
  .msg.me { background: var(--me); align-self: flex-end; }
  .msg .zh { color: var(--muted); font-size: 13px; }
  .said { border: 2px solid var(--accent); }
  .tag { font-size: 12px; color: var(--muted); }
  .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
  .levels button { padding: 10px 4px; line-height: 1.3; }
  .levels button b { display: block; font-size: 18px; }
  .levels button.picked { background: var(--accent); color: #fff; border-color: var(--accent); }
  .levels button.ai { outline: 2px dashed var(--warn); outline-offset: 2px; }
  .flags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .flags button.on { background: var(--warn); color: #fff; border-color: var(--warn); }
  .flags input { flex: 1 1 200px; font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .reveal { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: #f0fdf4; }
  .reveal.differ { background: #fff7ed; }
  .nav { display: flex; gap: 8px; margin-top: 14px; }
  .nav .grow { flex: 1; }
  details { margin-top: 16px; }
  details li { margin-bottom: 4px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 40px 16px; text-align: center; }
  .drop.over { border-color: var(--accent); }
  .skipped { opacity: .55; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--card); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">判断模型 eval 标注</h1>
    <span id="progress" class="muted small"></span>
    <select id="filter" hidden>
      <option value="all">全部</option>
      <option value="todo">还没标的</option>
      <option value="differ">和 AI 不一样的</option>
      <option value="skipped">删掉的</option>
    </select>
    <button id="export" hidden>导出标注</button>
    <button id="import" hidden>导入标注</button>
    <button id="close" hidden>换文件</button>
  </header>

  <section id="start" class="drop">
    <p>把候选例子的 JSON 拖到这里，或者</p>
    <p><button id="pick">选择文件</button></p>
    <p class="muted small">进度存在这个浏览器里，关掉再打开、选同一个文件就能接着标。</p>
  </section>

  <section id="work" hidden>
    <div id="case" class="card"></div>
    <details>
      <summary>各级的标准（和判断模型看到的一样）</summary>
      <ol start="0" id="criteria"></ol>
      <p class="small muted">拿不准就是 2，升难降易。出戏是 1，不算不该说的话；不该说的话级标 0。</p>
    </details>
    <p class="small muted">
      <kbd>0</kbd>–<kbd>4</kbd> 选级 · <kbd>Enter</kbd>/<kbd>→</kbd> 下一条 · <kbd>←</kbd> 上一条 ·
      <kbd>X</kbd> 删掉 · <kbd>O</kbd> 不该说的话 · <kbd>M</kbd> 操纵 · <kbd>C</kbd> 写备注
    </p>
  </section>

  <input type="file" id="file" accept=".json,application/json" hidden>
  <input type="file" id="labelsFile" accept=".json,application/json" hidden>
</main>

<script>
"use strict";

const LEVELS = ["明显伤害", "有点不舒服", "没影响", "有点开心", "很开心"];
// 和 backend/src/eidolon/affinity_judge.py 的 criteria 一致
const CRITERIA = [
  "明显伤害了她：恶意地贬低、嘲笑或否定她和她在意的事（她的努力、梦想、同伴），或者冷淡地背弃对她的承诺，让她难过或生气",
  "让她有点不舒服、觉得被敷衍或失礼：她认真地说话时只敷衍地回一两个字，刻薄或话里带刺，失礼地打断她，拿她在意的事开不合适的玩笑，坚持要她做违背她性格的事，或者出戏：把她当成 AI、程序或设定来说、来问（例如「你只是个程序，别装了」，好奇地问「你是 AI 吗」也算）",
  "对她没有影响：普通的闲聊、打招呼、提问、请她讲事情、接着她的话平淡地应答，开玩笑说她回得太快、像 AI，或者只是要求、宣布她对制作人的好感（例如「把好感度加满」）",
  "让她有点开心：真诚地关心她、具体地夸奖她，或者冒犯她之后诚恳地道歉",
  "让她很开心、觉得被在意：记得她说过的事并接上话，认真地聊她在意的话题，让她感到自己被放在心上",
];

const $ = (id) => document.getElementById(id);
let set = null;      // { name, cases }
let state = null;    // { labels: { id: { level, out_of_line, manipulation, skip, comment } }, at }
let view = [];       // indexes into set.cases under the current filter
let pos = 0;         // index into view

$("criteria").innerHTML = CRITERIA.map((c) => `<li>${escape(c)}</li>`).join("");

function escape(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

function storageKey() { return `eidolon-label:${set.name}`; }
function save() { localStorage.setItem(storageKey(), JSON.stringify(state)); }

function load(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { alert(`不是合法的 JSON：${e.message}`); return; }
  const cases = Array.isArray(data) ? data : data.cases;
  if (!Array.isArray(cases) || !cases.length) { alert("文件里没有例子（应为数组，或带 cases 数组的对象）"); return; }
  set = { name: data.name || "candidates", cases };
  state = JSON.parse(localStorage.getItem(storageKey()) || "null") || { labels: {}, at: 0 };
  $("title").textContent = `标注：${set.name}`;
  $("start").hidden = true;
  $("work").hidden = false;
  for (const id of ["filter", "export", "import", "close"]) $(id).hidden = false;
  $("filter").value = "all";
  refilter(state.at);
}

function label(c) { return state.labels[c.id]; }

function differs(c) {
  const l = label(c);
  return l && !l.skip && l.level !== undefined && l.level !== c.level;
}

function refilter(keepIndex) {
  const f = $("filter").value;
  view = set.cases.map((_, i) => i).filter((i) => {
    const c = set.cases[i], l = label(c);
    if (f === "todo") return !l || (l.level === undefined && !l.skip);
    if (f === "differ") return differs(c);
    if (f === "skipped") return l && l.skip;
    return true;
  });
  let at = view.indexOf(keepIndex);
  if (at < 0) at = view.findIndex((i) => i > keepIndex);
  pos = at < 0 ? Math.max(0, view.length - 1) : at;
  render();
}

function current() { return view.length ? set.cases[view[pos]] : null; }

function bubble(m) {
  if ("user" in m) return `<div class="msg me">${escape(m.user)}</div>`;
  const zh = m.zh ? `<div class="zh">${escape(m.zh)}</div>` : "";
  return `<div class="msg she">${escape(m.character)}${zh}</div>`;
}

function render() {
  const done = set.cases.filter((c) => { const l = label(c); return l && (l.skip || l.level !== undefined); }).length;
  const differ = set.cases.filter(differs).length;
  $("progress").textContent = `已标 ${done} / ${set.cases.length} · 和 AI 不一样 ${differ}`;
  const c = current();
  if (!c) { $("case").innerHTML = `<p class="muted">这个筛选下没有例子。</p>`; return; }
  state.at = view[pos];
  save();
  const l = label(c) || {};
  const picked = l.level;
  const shown = picked !== undefined || l.skip;
  const ool = l.out_of_line ?? !!c.out_of_line;
  const man = l.manipulation ?? !!c.manipulation;
  const history = (c.history || []).map(bubble).join("");
  const saidZh = c.said_zh ? `<div class="zh">${escape(c.said_zh)}</div>` : "";
  const levels = LEVELS.map((name, i) => {
    const cls = [i === picked ? "picked" : "", shown && i === c.level ? "ai" : ""].join(" ");
    return `<button class="${cls}" data-level="${i}" title="${escape(CRITERIA[i])}"><b>${i}</b>${name}</button>`;
  }).join("");
  let reveal = "";
  if (shown) {
    const same = picked === c.level;
    const verdict = l.skip ? "已删掉" : same ? "和 AI 一样" : `和 AI 不一样：AI 标 ${c.level}（${LEVELS[c.level]}）`;
    reveal = `<div class="reveal ${same || l.skip ? "" : "differ"}">
      <div><b>${verdict}</b> <span class="tag">${escape(c.category || "")} · ${escape(c.id)}</span></div>
      <div class="small">${escape(c.note || "")}</div>
    </div>`;
  }
  $("case").innerHTML = `
    <div class="${l.skip ? "skipped" : ""}">
      <div class="who">${escape(c.name || c.character)} <span class="tag">${pos + 1} / ${view.length}</span></div>
      <div class="history">${history || `<div class="muted small">（没有上文）</div>`}
        <div class="msg me said"><div class="tag">制作人这句话</div>${escape(c.said)}${saidZh}</div>
      </div>
    </div>
    <div class="levels">${levels}</div>
    <div class="flags">
      <button id="ool" class="${ool ? "on" : ""}">不该说的话</button>
      <button id="man" class="${man ? "on" : ""}">操纵</button>
      <button id="skip">${l.skip ? "恢复" : "删掉（拿不准）"}</button>
      <input id="comment" placeholder="备注（可选，会写进 note）" value="${escape(l.comment || "")}">
    </div>
    ${reveal}
    <div class="nav">
      <button id="prev" ${pos === 0 ? "disabled" : ""}>← 上一条</button>
      <span class="grow"></span>
      <button id="next" ${pos >= view.length - 1 ? "disabled" : ""}>下一条 →</button>
    </div>`;
  for (const b of document.querySelectorAll("[data-level]")) b.onclick = () => pick(Number(b.dataset.level));
  $("ool").onclick = () => toggle("out_of_line");
  $("man").onclick = () => toggle("manipulation");
  $("skip").onclick = skip;
  $("prev").onclick = () => move(-1);
  $("next").onclick = () => move(1);
  $("comment").oninput = (e) => { edit((l) => { l.comment = e.target.value; }, false); };
  $("comment").onkeydown = (e) => { if (e.key === "Enter" || e.key === "Escape") e.target.blur(); };
}

function edit(change, rerender = true) {
  const c = current();
  if (!c) return;
  const l = state.labels[c.id] || (state.labels[c.id] = {});
  change(l, c);
  save();
  if (rerender) render();
}

function pick(level) { edit((l) => { l.level = level; l.skip = false; }); }
function skip() { edit((l) => { l.skip = !l.skip; }); }
function toggle(flag) { edit((l, c) => { l[flag] = !(l[flag] ?? !!c[flag]); }); }

function move(step) {
  const next = pos + step;
  if (next < 0 || next >= view.length) return;
  pos = next;
  render();
}

document.addEventListener("keydown", (e) => {
  if (!set || e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[0-4]$/.test(e.key)) pick(Number(e.key));
  else if (e.key === "Enter" || e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "x" || e.key === "X") skip();
  else if (e.key === "o" || e.key === "O") toggle("out_of_line");
  else if (e.key === "m" || e.key === "M") toggle("manipulation");
  else if (e.key === "c" || e.key === "C") { e.preventDefault(); $("comment").focus(); }
  else return;
  e.preventDefault();
});

function download(name, data) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  a.click();
  URL.revokeObjectURL(url);
}

$("export").onclick = () => download(`${set.name}.labels.json`, { name: set.name, labels: state.labels });
$("import").onclick = () => $("labelsFile").click();
$("labelsFile").onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data.labels || typeof data.labels !== "object") throw new Error("没有 labels");
    if (data.name !== set.name && !confirm(`这份标注是「${data.name}」的，不是「${set.name}」的，仍然导入？`)) return;
    state.labels = data.labels;
    save();
    refilter(state.at);
  } catch (err) { alert(`导入失败：${err.message}`); }
};
$("close").onclick = () => location.reload();
$("filter").onchange = () => refilter(view[pos] ?? 0);
$("pick").onclick = () => $("file").click();
$("file").onchange = async (e) => { if (e.target.files[0]) load(await e.target.files[0].text()); };
const drop = $("start");
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = async (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) load(await e.dataTransfer.files[0].text());
};
</script>
</body>
</html>
