[[retrieval]]
id = "hiori-long-recall-unit-name"
character = "hiori"
long = true
history = [
  { user = "今日は朝からずっと雨だったね。事務所に来る途中で傘が風にあおられて、骨が一本折れちゃったんだ。駅前のコンビニで新しいのを買おうかとも思ったんだけど、ビニール傘ってすぐどこかに置き忘れちゃうから、結局そのまま折れた傘をさして歩いてきたよ。おかげで肩のあたりがびしょびしょで、着いてすぐにタオルを借りることになった。はづきさんは笑いながら、事務所にも予備の傘を何本か置いておきましょうかって言ってくれたけど、そうなると今度は誰の傘か分からなくなりそうだよね。名前を書いたシールでも貼っておけばいいのかな。それにしても、この時期の天気って本当に読めないよね。朝の天気予報では午後から晴れるって言ってたのに、結局夕方まで降りっぱなしだった。外のロケが入っていなくて本当によかったよ。そういえば、事務所の窓から見える向かいのビルの屋上に、小さな花壇があるのに気づいた？雨に濡れて、紫色の花がすごく鮮やかに見えたんだ。名前は分からないけど、たぶん紫陽花じゃないかな。去年の今ごろも同じ場所に咲いてたのかもしれないけど、全然気づかなかったな。毎日同じ窓から外を見てるはずなのに、意外と見えてないものって多いんだね。帰りに通る商店街も、最近シャッターの閉まってたお店に新しいパン屋さんが入ったらしくて、朝はいい匂いがしてるんだ。まだ入ったことはないんだけど、今度時間があったら寄ってみようと思ってる。クロワッサンが評判らしいよ。それから、駅の階段のところにツバメの巣があって、毎朝ヒナが口を開けて親鳥を待ってるのが見えるんだ。真乃に話したら、きっと喜んで見に行きたがるだろうな。それにしても、雨の日の事務所って、なんだか音が違って聞こえるよね。窓に当たる雨の音とか、遠くの車が水たまりを走る音とか。はづきさんはそういう音を聞きながら事務作業をするのが好きなんだって。集中できるらしいよ。俺はどちらかというと、雨の日は眠くなっちゃうほうなんだけど。そういえば、さっき事務所の前の植え込みで、大きなカタツムリを見つけたんだ。最近はあまり見かけないから、ちょっと珍しくて、しばらくしゃがんで眺めちゃったよ。通りがかった近所の小学生にも、何してるのって不思議そうな顔をされた。灯織はああいう花の名前、詳しかったりする？" },
  { character = "紫陽花だと思います。この季節によく咲いていますし、色も紫から青に近いものまで、土によって変わるそうです。私も詳しいわけではないんですが、以前、雑誌の撮影で花の名前を覚える機会があって、そのときに少しだけ調べました。それより、プロデューサー、肩が濡れたままだと風邪をひきますよ。タオルで拭いただけでは足りないと思います。着替えがないなら、せめて温かい飲み物を飲んでください。給湯室に紅茶のティーバッグがありますから、よければ私が淹れます。……それと、傘のことですが、事務所に予備を置くなら、色を全部変えておくのはどうでしょうか。一本ずつ違う色にしておけば、誰がどれを借りたか分かりやすいですし、返し忘れも減ると思います。名前のシールでもいいですけど、雨の日はすぐ剥がれてしまいそうなので。私、こういう細かいことを考えるのは苦手じゃないので、もしよければ、はづきさんと相談してリストを作っておきます。それから、給湯室の棚のことも少し気になっていました。マグカップが増えすぎて、誰のものか分からないものが何個かあるんです。はづきさんに聞いたら、前に撮影でいただいたものかもしれないとのことでした。使っていないものは、一度まとめて箱に入れておいて、持ち主が見つからなければ処分する、という形にすればすっきりすると思います。もちろん、勝手に片付けるわけにはいかないので、事務所の皆さんに一言お知らせしてからにします。こういうことを言うと、また細かいって言われそうですが……整理されているほうが、探し物の時間も減りますから。あと、明日も午前中は雨の予報でした。念のため、折りたたみ傘を鞄に入れておいたほうがいいと思います。占いでも、明日は忘れ物に注意って書いてありましたから。ちなみに、ラッキーアイテムは青いハンカチだそうです。プロデューサーは青いハンカチ、持っていますか。……いえ、別に、占いを信じてほしいというわけではないんです。ただ、なんとなく気になって。それから、カタツムリの話ですが、私も小さい頃、雨上がりの公園の紫陽花の葉っぱで見つけたことがあります。殻の模様が一つずつ違っていて、ずっと見ていても飽きませんでした。……すみません、話がそれました。とにかく、今日は早めに帰って、温かいお風呂に入って休んでください。" },
  { user = "ありがとう、紅茶お願いしようかな。灯織の淹れてくれる紅茶、香りがよくて好きなんだ。傘の色分けもいいアイデアだね、はづきさんに伝えておくよ。それにしても、明日の占いまでチェックしてくれてるなんて、さすがだな。折りたたみ傘、実はどこかにしまったきり見当たらないんだよね。帰りに文房具屋さんの隣の雑貨屋で、新しいのを探してみようかな。最近の折りたたみ傘って、すごく軽くて小さいのがあるらしいよ。鞄に入れても全然重くならないんだって。……そうだ、雑貨屋といえば、この前その店の前を通ったら、季節の飾りがもう夏っぽくなってたんだ。風鈴とか、金魚の模様の手ぬぐいとか。まだ梅雨も明けてないのに、気が早いよね。でも、ああいうのを見ると、ちょっと気分が明るくなる気がする。事務所にも何か一つ飾ってみようか。風鈴は音がうるさいって言われそうだから、小さな置物くらいがいいかな。青いハンカチは、たしか引き出しのどこかにあった気がするな。明日は探して持ってくるよ。カタツムリの殻の模様が一つずつ違うっていうのは知らなかった。今度見つけたら、もっとよく見てみるよ。それから、さっきはづきさんと話してたんだけど、事務所の観葉植物の元気がないらしいんだ。窓際に置いてあるやつ、葉っぱの先が少し茶色くなってるよね。水のあげすぎなのか、日当たりが足りないのか、誰も詳しくなくて困ってるんだ。今度、園芸店の人に聞いてみようかって話になってる。あと、そうそう、今日の昼に入った定食屋さんで、テレビに花火大会の特集が流れてたんだ。今年は例年より大きな花火が上がるらしくて、店のおじさんが常連さんと、どこから見るのが一番いいかって熱心に話し込んでた。川沿いの土手がいいとか、ビルの屋上が穴場だとか。聞いてるうちにこっちまで行きたくなっちゃったよ。人混みはすごいんだろうけど、ああいう夏の行事って、行けば行ったで楽しいんだよね。浴衣の人がたくさん歩いてるのを見るだけでも、季節を感じられるし。灯織は、夏になったらやってみたいこととかある？仕事じゃなくて、普通の、個人的なことで。" },
  { character = "夏にやってみたいこと、ですか。……あまり考えたことがありませんでした。毎年、夏はレッスンと課題で終わってしまう気がして。でも、そうですね……強いて言うなら、夜に星を見に行ってみたいです。都内だと明るすぎてあまり見えないので、少し遠くの、空の広いところに。それから、新しいお弁当のおかずを、季節の野菜で何品か考えてみたいです。夏はどうしても傷みやすいので、日持ちのする味付けを研究しないといけませんし。……すみません、結局、個人的なことと言いながら、料理の話になってしまいました。それと、事務所の飾りの件ですが、置物なら私も賛成です。風鈴は、確かに電話の邪魔になるかもしれません。ガラスの小さな金魚とか、涼しそうなものがいいと思います。雑貨屋さんに行くなら、ついでに見てきてもらえますか。もし迷ったら、写真を送ってください。私も一緒に選びます。花火大会の話も、少し気になりました。人が多いところは得意ではありませんが、遠くから見るだけなら、きっときれいだと思います。めぐるはきっと浴衣を着て行きたいって言い出すでしょうし、真乃は人混みが苦手なので、三人で行くなら、少し離れた静かな場所を探したほうがいいかもしれません。……すみません、まだ行くと決まったわけでもないのに、つい段取りを考えてしまいました。スケジュール管理が癖になっているのかもしれません。紅茶、淹れてきました。少し熱いので、気をつけてくださいね。観葉植物のことは、たぶん水のあげすぎだと思います。梅雨の時期は土がなかなか乾かないので、表面が乾いてから水をあげるくらいでちょうどいいそうです。前に、母がベランダで育てていた鉢を枯らしてしまったことがあって、そのときに少し調べました。それと、窓際は日当たりがよくても、エアコンの風が直接当たると弱ってしまうらしいです。場所を少しずらしてみるのもいいかもしれません。……私、本当にこういう細かいことばかり気にしてしまいますね。でも、事務所の植物が元気なほうが、みんなも気持ちよく過ごせると思うので。" },
]
said = "ありがとう。……そういえば、イルミネって名前を最初に伝えた日のこと、灯織は覚えてる？あの時どう思ってたのか、ずっと気になってたんだ"
expected = "recall"
note = "长上文：上文是雨天、雨伞、杂货店之类的闲谈（制作人还说了自己的事，截掉 said 的模型容易判成 memories 或 nothing）。said 问组合名第一次公布那天的经过和她当时的想法，recall。"
reviewed = true

[[retrieval]]
id = "kogane-long-references-neo-theory-release"
character = "kogane"
long = true
history = [
  { character = "プロデューサー、聞いて聞いて！今日のお昼、寮のみんなで鍋パーティーしたとよ！咲耶がお野菜ば切ってくれて、うちがお出汁ば作ったと。お出汁はね、お母ちゃんが送ってくれたあごだしば使ったけん、ばりうまかったばい！摩美々は最初『お鍋とか、めんどくさーい』とか言いよったくせに、いっちばん食べよったし、結華はずーっと写真撮りよったし、霧子は『恋鐘ちゃんのお出汁、優しい味がする……』って言うてくれて、うち、もう嬉しゅうて嬉しゅうて。最後は雑炊にしたとやけど、卵ばふわっとさせるのがコツなんよ。火ば止めてから溶き卵ば回し入れて、蓋ばして一分待つと。そしたらちょうどよか感じに固まるけん。今度プロデューサーにも作ってあげるね！あ、それとね、白菜は霧子が近くの八百屋さんで選んできてくれたとよ。霧子、お野菜の目利きがばり上手かと！葉っぱの巻き具合とか、切り口の色とか、ちゃんと見て選びよったけん、うちもびっくりしたばい。お店のおばちゃんにも『よか子やねえ』って褒められよったって。うちが長崎におった頃も、お母ちゃんと一緒に朝の市場に行きよったけん、なんか懐かしか気持ちになったと。市場の人たちはみんな声が大きゅうて、朝からにぎやかやったなあ。そうそう、それとね、デザートに結華が買うてきたプリンば食べたっちゃけど、なんか期間限定のやつで、上にカラメルのソースが二層になっとったと。あれはびっくりしたばい。コンビニのプリンもどんどん進化しよるね。摩美々は『二層とか、ずるくないー？』って言いながら二個目ば狙いよったけん、うちが止めたとよ。結局、最後の一個はみんなでじゃんけんして、霧子が勝ったと。霧子、嬉しそうにちょびっとずつ食べよったばい。そいでね、鍋のあとはみんなでトランプしたとよ！大富豪ってゲームなんやけど、長崎と東京でルールがちょっと違うとって、最初はばり揉めたと。うちの地元では革命のあとにもう一回革命できるとけど、結華は『それはローカルルールだよ～』って言うし、咲耶は『じゃあ両方のルールで一回ずつやってみようか』ってまとめてくれて。結局、霧子がいっちばん強かったと！霧子、静かな顔してカードの切り方がばりうまかとよ。摩美々は途中で寝そうになっとったけど、最後まで付き合ってくれたばい。" },
  { user = "楽しそうだね。寮のみんなで鍋か、いいなあ。恋鐘の作るお出汁は本当においしいから、みんな喜んだだろうね。雑炊のコツも勉強になるよ、蓋をして一分待つのか。卵がかたくなりすぎちゃうことが多いんだけど、火を止めてから入れるのがポイントなんだね。今度、事務所で何か作るときも、ぜひ頼むよ。それにしても、プリンが二層になってるのは知らなかったな。最近のコンビニスイーツって本当に凝ってるよね。期間限定って書かれると、ついつい手に取っちゃう気持ちも分かるよ。霧子が野菜を選んでくれたっていうのもいい話だね。みんなで買い物から一緒にやると、出来上がったときの楽しさも全然違うと思うよ。学生の頃に友達と鍋をやったことがあるけど、誰が何を買ってくるか決めてなくて、結局全員が豆腐を買ってきたことがあったな。あの時は豆腐ばっかりの鍋になって、それはそれで笑えたけど。ちゃんと分担を決めておくのは大事だね。それにしても、あごだしってそんなに違うものなんだ。普通の鰹だしとはまた違う、すっきりした味がするって聞いたことがあるよ。一度ちゃんと味わってみたいな。そういえば、寮のキッチンって、みんなで料理するには狭くない？前に咲耶が、調理台が一つしかないから順番待ちになるって言ってた気がするんだけど。鍋だったら一つの鍋でみんな食べられるから、ちょうどいいのかな。トランプのルールが地域で違うっていうのも面白いね。大富豪は特にローカルルールが多いって聞いたことがあるよ。都落ちとか、八切りとか、地方によって全然違うらしい。でも、揉めたときに咲耶がうまくまとめてくれるあたり、L'Anticaらしいなって思うよ。霧子が強かったっていうのは意外だけど、なんだか分かる気もする。落ち着いてるから、表情に出ないんだろうね。摩美々が最後まで付き合ったっていうのも、ああ見えて付き合いがいいんだよな。みんなが集まるときに、誰が何をするかってどうやって決めてるの？やっぱり恋鐘がリーダーとして仕切ってるのかな。" },
  { character = "んふふ～、そりゃもちろん、うちが仕切っとるとよ！料理させたら、うちの右に出るもんはおらんけんね！……って言いたいとこやけど、実はみんなけっこう自分のやりたいことば勝手にやりよると。咲耶は切るのが上手やけん、自然と包丁係になるし、霧子はお皿ば並べたりお茶ば淹れたりしてくれるし、結華は盛り付けのセンスがよかけん、最後の仕上げば任せとる。摩美々は……うーん、味見係？いっつも『もうちょっと味見しないとわかんなーい』って言うて、つまみ食いばっかりしよるとよ。ばってん、摩美々が『おいしい』って言うたら、それはほんとにおいしかってことやけん、ある意味いちばん大事な係かもしれん。それから、お皿洗いはじゃんけんで決めとると。うちはなぜかいっつも負けるとよ……。結華は『こがたん、グー出す癖あるよね～』って笑いよるけど、そがん癖なかもん！……たぶん。ばってん、お皿洗いも嫌いやなかよ。お店の手伝いでいっぱい洗いよったけん、早さなら誰にも負けんばい。咲耶が隣で拭いてくれるけん、二人でお話ししながらやりよったら、あっという間に終わると。キッチンは確かに狭かけど、みんなでわいわいしながら作るのが楽しかとよ。肘がぶつかったりするのも、なんか家族みたいで好き。この前なんか、咲耶がお玉ば持ったまま振り向いたら、ちょうど結華の頭にこつんって当たって、二人で大笑いしよったとよ。長崎のお店も、忙しか時はこがん感じやったなあって思い出すと。お父ちゃんとお母ちゃんが狭か厨房で、ぶつからんようにくるくる動きよったのば、うちはずっと見よったけん。そいけん、うちは料理するとき、誰かと一緒におるほうが好きとよ。一人で作るのも嫌いやなかばってん、誰かの『おいしか！』って声が聞こえんと、なんか物足りんと。……あ、そうそう、プロデューサー、トランプの話やけど、今度事務所でもやらん？はづきも誘って、みんなで大富豪大会ばしようよ！うち、次こそ霧子に勝つけん！特訓しとかんばね。結華に教えてもらうと、またからかわれそうやけん、咲耶に頼もうかな。咲耶やったら、優しく教えてくれそうやし、負けても『恋鐘は頑張ったよ』って言うてくれそうやけん。んふふ～、なんか今から楽しみになってきたばい！みんなの分のおやつも、うちが作っていくけんね。何がよかかなあ、やっぱりカステラ風のパウンドケーキかな。" },
  { user = "いいチームワークだね。それぞれ得意なことを自然に分担してるんだ。摩美々の味見係っていうのも、なんだか彼女らしくて笑っちゃうな。でも確かに、正直な感想を言ってくれる人がいるのは大事だよね。恋鐘の話を聞いてると、寮での暮らしがすごく楽しそうで安心するよ。最初に上京してきた頃は、一人で大変だったと思うけど、今はこうやってみんなと一緒にご飯を作って食べられる場所があるんだもんね。じゃんけんでいつも負けるっていうのは、ちょっと気になるけどね。結華の言う通り、出す手に癖があるのかもしれないよ。今度、こっそり観察してみようかな。……冗談だよ。でも、お皿洗いを嫌がらずにやるところが恋鐘らしいな。ご実家のお店で手伝ってきた経験が、こういうところでも活きてるんだね。咲耶と二人で話しながら片付けるっていうのも、なんだかいい光景だ。……あ、そうだ、来週の打ち合わせの資料、まだ印刷してなかった。忘れないうちにやっておかないと。恋鐘も、来週は雑誌の取材とラジオの収録が続くから、体調には気をつけてね。寝る前にスマホを見すぎないこと。それと、取材の衣装合わせが水曜日にあるから、その日は少し早めに事務所に来てもらえると助かるよ。衣装合わせのあとに、スタイリストさんが次のジャケット撮影のイメージも少し相談したいって言ってるから、時間には余裕を持っておいてね。大富豪大会は、みんなのスケジュールが空いてる日を探してみるよ。はづきさんもきっと喜んで参加すると思う。ただ、事務所でやるなら、あんまり盛り上がりすぎて社長に怒られないようにね。……いや、社長も参加したがるかもしれないな。それから、ラジオの収録のときは、リスナーからのお便りを何通か読むコーナーがあるらしいから、事前に台本に目を通しておいてね。恋鐘の長崎弁、リスナーさんに人気があるみたいだから、無理に直さなくて大丈夫だよ。" },
]
said = "あと、ラジオで曲の紹介をするかもしれないから確認しておきたいんだけど、アンティーカの『NEO THEORY FANTASY』って発売日いつだったっけ？"
expected = "references"
note = "长上文：上文是宿舍火锅、便利店布丁、工作安排的闲谈。said 才问歌曲的发售日（作品资料：LACM-14863）。截掉 said 的模型多半判 nothing。"
reviewed = true

[[retrieval]]
id = "mano-long-memories-moving"
character = "mano"
long = true
history = [
  { character = "プロデューサーさん、今日ここに来る途中で、すごく大きな雲を見たんです。もくもくしてて、まるでソフトクリームみたいな形で……思わず立ち止まって、しばらく見上げちゃいました。おばあさんは、お孫さんがわたしたちのライブを見たことがあるって言っていて、びっくりしちゃいました。お孫さんによろしくお伝えくださいって言ったら、にこにこして手を振ってくださって……なんだか心がぽかぽかしました。そうしたら、近くのベンチに座っていたおばあさんが、『いい雲ねえ』って声をかけてくださって。それで、少しだけお話ししたんです。そのおばあさんは、毎朝その道をお散歩してるそうで、季節ごとに雲の形が違うのが楽しいって教えてくださいました。春の雲はふわふわで、夏は高くて、秋は薄くて細長い、って。わたし、そんなふうに雲を見たことがなかったので、ほわっ……ってなりました。それからまた歩き出して、信号を待っている間も、ずっと空ばかり見ていました。危ないですよね……えへへ。途中の並木道では、すずめさんたちが電線にずらっと並んでいて、みんなで同じ方向を向いていたんです。何を見ているのかなって思って、わたしも同じ方を見てみたら、遠くの方にさっきの大きな雲がありました。すずめさんたちも、雲を見ていたのかもしれません……なんて、ちょっと考えすぎでしょうか。それから、パン屋さんの前を通ったときに、焼きたてのいい匂いがして、思わずお腹が鳴っちゃいそうになりました。朝ごはん、ちゃんと食べてきたはずなんですけど……。でも、今日はなんだか、空がいつもより広く感じたんです。ここに着いてからも、窓の外の雲がゆっくり流れていくのを見てました。ピーちゃんにもあの雲を見せてあげたかったな……。帰ったら、どんな形だったか、お話ししてあげようと思います。ピーちゃん、わたしがお話ししているとき、首をかしげて聞いてくれるんです。それがすごくかわいくて……。それから、事務所に着く少し前に、小さな男の子がお母さんと手をつないで歩いていたんです。男の子が、あの雲、くじらみたい！って空を指さしていて……わたしにはソフトクリームに見えていたので、同じ雲でも見る人によって違うんだなって、なんだか不思議な気持ちになりました。お母さんが、ほんとだね、って優しく笑っていて、見ているわたしまで嬉しくなっちゃいました。ああいう、なんでもない、ほわっとする瞬間が、わたしはすごく好きなんです。" },
  { user = "そうか、それは素敵な出会いだったね。雲の形で季節を感じるっていうのは、言われてみると確かにそうかもしれないな。俺も普段は時間に追われて、なかなか空を見上げる余裕がないから、真乃の話を聞いてると、ちょっと立ち止まってみるのもいいなって思えるよ。ソフトクリームみたいな雲か、見てみたかったな。それにしても、知らない人とそんなふうに自然にお話しできるなんて、真乃も変わったね。もちろん、いい意味でだよ。前は、人と話すときに少し緊張してるように見えることもあったけど、今の話を聞いてると、すごくリラックスしてたのが伝わってくる。そういうのは、ステージの上でもきっと活きると思う。お客さん一人ひとりと、そういうふうに心を通わせられたら素敵だよね。すずめが雲を見てたっていう話も、真乃らしくて素敵だな。案外、本当にそうなのかもしれないよ。鳥たちにも、天気や空の変化を感じ取る力があるっていうし。ピーちゃんも、雨が降る前は少し落ち着かなかったりするのかな。今度、そういうところも観察してみると面白いかもしれないね。そういえば、来週の撮影、空がきれいに見える屋上のスタジオらしいよ。天気がよければ、今日みたいな雲が背景に入るかもしれない。スタッフさんも、自然光がきれいに入る時間帯を狙って撮りたいって張り切ってたよ。午前中の光がいちばん柔らかいんだって。カメラマンさんは前にも一緒に仕事をした人だから、真乃もきっとリラックスできると思う。くじらとソフトクリームか、同じ雲でも見え方が違うっていうのは面白いね。真乃が見つけるそういう小さな瞬間って、聞いているこっちまで穏やかな気持ちになるよ。撮影のときも、カメラマンさんに見えている景色と、真乃に見えている景色はきっと違うから、真乃が素敵だと思ったものを、そのまま表情に出してくれればいいと思う。無理に作った笑顔より、そういう自然な表情のほうが、写真を見た人に伝わるんだ。きっといい写真になるよ。" },
  { character = "ほわぁ……屋上のスタジオなんですね！空が見えるところでの撮影、すごく楽しみです。今日みたいな雲が出てくれたら嬉しいな……。あの、わたし、前より少しは人とお話しできるようになったのかなって、自分でも思うことがあるんです。灯織ちゃんやめぐるちゃんと一緒にいると、自然と笑顔になれて、その気持ちのまま、ほかの人とも話せるようになった気がします。でも、まだ緊張しちゃうことも多くて……。この前も、雑誌のインタビューで、質問にうまく答えられなくて、えっと、あの、ってなってしまいました。記者さんは優しく待ってくださったんですけど、あとで、もっとちゃんとお話しできたらよかったなって思って。むんっ……次は、もう少し落ち着いてお話しできるように頑張ります。それと、灯織ちゃんが言っていたんです。緊張したときは、深呼吸を三回して、手のひらに『人』って書いて飲み込むといいって。灯織ちゃんは占いやジンクスに詳しいので、いろいろ教えてくれるんです。めぐるちゃんは、緊張したら思いっきり笑えばいいんだよって言っていました。二人とも全然違うことを言うので、なんだかおかしくて、三人で笑っちゃいました。でも、どっちも試してみようと思います。そうだ、撮影の日は、お天気がよかったら、ピーちゃんのために雲の写真を撮ってきてもいいですか？ピーちゃん、空を見るのが好きなんです。雲の写真を見て、どんなお顔をするのか、今からすごく楽しみです。あの、それから、めぐるちゃんが今度のオフに、三人でお花の公園に行こうって誘ってくれているんです。灯織ちゃんがお弁当を作ってくれるって言っていて……わたしは、デザートにいちごを持っていこうと思ってます。めぐるちゃんは、レジャーシートとボールを持っていくって張り切っていました。お天気がよかったらいいな……。あ、でも、お花の公園は人が多いかもしれないので、朝早めに行こうって灯織ちゃんが言ってました。灯織ちゃん、こういうときいつも頼りになるんです。めぐるちゃんは、着いたらまず一番大きな花壇の前で三人の写真を撮ろうって言っていて……わたし、写真を撮られるとき、まだちょっと緊張しちゃうんですけど、二人と一緒なら、自然に笑える気がします。むんっ……撮影の練習だと思って、頑張ってみます。" },
  { user = "もちろん、撮影の合間なら大丈夫だよ。スタッフさんにも一言伝えておくね。インタビューの件は、そんなに気にしなくていいと思うよ。言葉に詰まっても、真乃が一生懸命考えて答えようとしているのは、ちゃんと伝わってたはずだから。記者さんも、そういうところを素敵だと思って記事にしてくれると思う。完璧に話せることより、真乃らしい言葉で話すことのほうが大事だよ。……それにしても、ピーちゃんのために写真か。真乃らしいね。ピーちゃんは、写真を見て何か反応したりするの？もしかしたら、空の写真を見たら、外に飛んで行きたくなっちゃうかもしれないね。そうそう、撮影の日の集合時間は朝九時で、メイクに少し時間がかかるから、前の日はゆっくり休んでおいてね。衣装は春っぽい淡い色のワンピースになるみたいだよ。撮影のあとはそのままスタジオで簡単なインタビューもあるから、今日の雲の話なんかをしてみたらいいと思う。真乃が見つけた景色の話は、聞いている人の気持ちまで明るくしてくれるからね。灯織に教わった深呼吸も、ぜひ試してみて。もし当日少し不安になったら、遠慮しないで声をかけてね。俺も現場にずっといるから。あ、それと、ピーちゃんの写真を撮るときは、ほかのお客さんが映り込まないようにだけ気をつけてね。屋上は一般の人も来る場所みたいだから。三人でお花の公園か、いいね。灯織のお弁当にいちごのデザート、めぐるのボール遊びか、楽しそうな一日になりそうだ。朝早めに出るっていう灯織の判断も、さすがだね。日焼けしないように、帽子と日焼け止めは忘れずにね。撮影の前に日焼けしちゃうと、メイクさんが困っちゃうから。もし写真を撮ったら、よかったら見せてほしいな。三人が楽しそうにしてる写真は、きっとファンのみんなにも喜んでもらえると思う。" },
]
said = "あ、そうだ、ちゃんと言ってなかったね。実は来月、引っ越すことになったんだ。今よりちょっと事務所に近くなるよ"
expected = "memories"
note = "长上文：上文是云、撮影安排、采访之类关于真乃的闲谈，不涉及制作人自己的生活。said 才是制作人说自己的近况（搬家），memories。截掉 said 的模型多半判 nothing。"
reviewed = true

[[retrieval]]
id = "meguru-long-recall-first-meeting"
character = "meguru"
long = true
history = [
  { character = "ねえねえプロデューサー、聞いて！今日ね、学校の帰りにクラスの友達と新しくできたクレープ屋さんに行ったんだ！メニューがすっごくいっぱいあって、もう全部おいしそうで、選ぶのに十分くらいかかっちゃった。いちごとカスタードのやつと、チョコバナナのやつと、あと期間限定の抹茶あずきで迷って迷って……結局、友達とシェアしようってことになって、三つ頼んじゃったんだ！えへへ。抹茶あずき、ちょっと大人の味って感じで、わたしはすっごく好きだったよ！友達はチョコバナナがいちばんだって言ってたけど。お店のお姉さんもすっごく優しくて、わたしたちが迷ってるのを見て、おすすめを教えてくれたんだ。クレープの生地がね、端っこがパリパリで真ん中がもちもちなの！あれ、どうやって焼いてるんだろう？お店の人が鉄板の上でくるって広げるのが、もう魔法みたいで、ずーっと見ちゃった。友達が『めぐる、口開いてるよ』って笑ってたんだけど、ほんとに開いてたかも！えへへ。わたしも家でやってみたいなって思ったけど、料理はあんまり得意じゃないから、灯織に教えてもらわなきゃだね。それでね、そのお店、店内に写真を撮るスペースがあって、壁にお花がいっぱい飾ってあるの！みんなで写真撮って、スクラップブックに貼ろうと思ってるんだ。真乃と灯織も今度連れて行きたいな！お店の窓から見える並木道も、夕方の光できらきらしてて、すっごくきれいだったんだー。あとね、帰り道に公園でバスケしてる小学生の子たちがいて、ちょっとだけ一緒にやらせてもらったんだ！みんなすっごく上手で、最後はわたしのほうが息切れしちゃった！その子たちね、来月市民大会に出るんだって！だからまた練習見に行くね、って約束しちゃった。えへへ、なんか先輩になった気分！それから、帰りにコンビニに寄ったら、新しいアイスが出てたの！はちみつレモン味！もう買うしかないって思って、歩きながら食べちゃった。すっごくさっぱりしてて、夏にぴったりの味だったよ。プロデューサーにも食べてほしいなー。あ、でも、プロデューサーはアイスより、あったかいお茶のほうが好きなんだっけ？" },
  { user = "楽しそうだね。三つ頼んでシェアするっていうのは、いいアイデアだな。いろんな味が楽しめるし。抹茶あずきが好きっていうのはちょっと意外だったけど、めぐるは本当に何でもおいしそうに食べるよね。写真を撮るスペースがあるお店か、最近はそういうところが多いんだね。スクラップブック、ずっと続けてるんだっけ。思い出が増えていくのはいいことだよ。真乃と灯織も、きっと喜ぶと思う。灯織は甘いものをそんなにたくさんは食べないかもしれないけど、めぐるが誘ったら一緒に行ってくれるんじゃないかな。真乃はお花の飾りを見て、きっとほわっとなるだろうね。クレープを焼くところをずっと見てたっていうのも、めぐるらしいな。興味を持ったことに夢中になれるのは、めぐるのいいところだよ。家でやるなら、ホットプレートでも案外上手にできるらしいから、灯織に教わりながら三人で挑戦してみたら？失敗しても、それはそれで楽しい思い出になると思う。小学生とバスケっていうのも微笑ましいね。めぐるが息切れするなんて、よっぽど元気な子たちだったんだろう。ただ、食べ過ぎには気をつけてね。来週はダンスレッスンが多いから、体が重くならないように。……って、めぐるなら一日で消費しちゃいそうだけど。小学生と約束したっていうのも、めぐるらしいね。きっとその子たち、めぐるが見に来てくれるのを楽しみにしてると思うよ。はちみつレモンのアイスか、めぐるの好きそうな味だね。アイスも嫌いじゃないから、今度見かけたら買ってみるよ。それにしても、一日でクレープを食べて、バスケをして、アイスまで食べるなんて、本当にエネルギーに溢れてるな。めぐるの一日を聞いてると、こっちまで元気をもらえる気がするよ。そういえば、はづきさんが、めぐるちゃんからクレープ屋さんの割引券をもらいましたって嬉しそうに話してたよ。最近、学校のほうはどう？部活の助っ人は、まだ頼まれてる？" },
  { character = "うん！最近はバスケ部とバレー部から、たまに頼まれるくらいかな。前みたいに毎日じゃなくなったから、ちゃんとお仕事と両立できてるよ！プロデューサーが一緒に考えてくれたおかげだね！えへへっ。あ、それとね、この前の体育祭、クラス対抗リレーでアンカーやったんだ！最後のカーブで二人抜いて、一位でゴールしたんだよ！クラスのみんながわーって集まってきて、胴上げされそうになっちゃった！さすがに恥ずかしかったから、逃げちゃったけど。でもでも、すっごく嬉しかったんだ！それでね、リレーのあと、陸上部の先生に『ぜひ陸上部に』ってまた誘われちゃった！ちゃんと『アイドルのお仕事があるので』って言ったら、『じゃあ大会のときだけでも』って言われて、どうしようかなーって。走るのは大好きだから、ちょっとだけ心が揺れちゃったけど、今はイルミネのことをいちばん頑張りたいんだ！だから、ちゃんとお断りしたよ。えらいでしょ？あとね、勉強のほうは……うーん、えっと、数学がちょっとピンチかも……。灯織に教えてもらう約束はしてるんだけど、なかなか時間が合わなくて。真乃も一緒に、今度お泊まり会で勉強会する予定なんだ！灯織、絶対に厳しいと思うけど、頑張るよ！テストで赤点取ったら、お仕事にも響いちゃうもんね。お泊まり会のときは、わたしのお母さんがまたホットケーキ焼いてくれるって！灯織が『勉強が終わってからね』って言いそうだけど、えへへ、楽しみなんだ！あとね、お泊まり会でやりたいことリストも作ってるんだ！まず勉強して、それからホットケーキ食べて、映画観て、最後に三人でお話ししながら寝るの！映画は真乃が動物のドキュメンタリーがいいって言ってて、灯織はなんでもいいって言ってたから、わたしが選ぶことになったんだ。何がいいかなー。みんなで笑えるやつがいいな！でもでも、わたし、いっつも映画の途中で寝ちゃうんだよね……。灯織に『最後まで起きてて』って言われるんだけど、夜は眠くなっちゃうんだもん。真乃も一緒にうとうとしてて、灯織だけ最後まで観てたこともあったよ。次の日に灯織が、結末を一生懸命説明してくれたんだけど、それがすっごく面白くて、二人で笑っちゃった！灯織はちょっと怒ってたけどね、えへへ。だから今回は、わたしも最後まで起きてられるように、お昼寝しておこうかなって思ってるんだ！" },
  { user = "アンカーで二人抜きか、すごいじゃないか。めぐるらしいな。胴上げから逃げたっていうのも想像できて笑っちゃうよ。体育祭の写真も、スクラップブックに貼るんだろうね。今度、完成したら見せてほしいな。めぐるのスクラップブックは、見てるだけで元気が出るから。数学は……まあ、灯織がいれば心強いね。お泊まり会で勉強会っていうのもいいアイデアだと思う。ただ、お泊まり会だと、ついおしゃべりが盛り上がって勉強が進まないかもしれないから、そこは灯織にしっかり見てもらってね。テストが終わったら、またご褒美にクレープを食べに行けばいいよ。陸上部の誘いをちゃんと自分で断れたのも、えらいと思うよ。めぐるが自分でよく考えて決めたことなら、俺はそれを応援する。もし大会のときだけ手伝いたくなったら、スケジュールを調整できるかもしれないから、そのときは遠慮なく相談してね。それと、来週の水曜日は、テレビ局で番組の打ち合わせがあるから、放課後そのまま来てもらえるかな。制服のままで大丈夫だよ。ただ、局の入り口で入館証の手続きがあるから、学生証は忘れずに持ってきてね。先方のディレクターさんが、めぐるの明るいキャラクターをすごく気に入ってくれてて、今度のコーナーでぜひってお話をいただいてるんだ。詳しいことは打ち合わせで説明するね。打ち合わせのあとは少し時間があるから、よかったら真乃と灯織も呼んで、三人で次のライブの衣装の相談をしようか。デザイナーさんから、ラフ画が何枚か届いてるんだ。めぐるの好きそうな明るい色のものもあったよ。それと、お泊まり会の映画、途中で寝ちゃうならせめて短めのものにしたらどうかな。……って、俺が口を出すことじゃないか。三人で楽しく過ごせるなら、それが一番だよ。ただ、次の日に朝早い仕事が入ってないかだけ、事前に確認しておいてね。確か、その週の土曜日はお昼からの撮影だったから、ゆっくり寝ても大丈夫だと思うけど。灯織にも、あまり厳しくしすぎないように言っておこうかな。……いや、言わなくても、灯織は最後には二人に甘いからね。" },
]
said = "……そういえば、初めて会った日のこと、めぐるは覚えてる？公園で俺のことにすぐ気づいてくれたよね。あの日、めぐるからはどう見えてたのか聞いてみたいな"
expected = "recall"
note = "长上文：上文是可丽饼店、体育祭、学习、工作安排的闲谈。said 问初次见面那天的经过和她当时的感受，recall。截掉 said 的模型多半判 nothing。"
reviewed = true

