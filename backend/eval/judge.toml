# 判断模型评测数据集（比较 Jev 与 Cloudflare Clef / Clef-flash，校准各模型的判断阈值）
#
# 用法：`eidolon eval judge` 读这份文件，用部署者配置的判断模型（JUDGE_PROVIDER）逐条提问：
# - [[retrieval]]：按对话中相同的方式组成 state（角色名、上文最多 4 条、制作人最新的一句话），
#   问检索、回忆、关于制作人三个问题，按当前阈值得出 nothing / memories / references / recall，
#   和 expected 比较；同时打印三个问题各自的概率，供调阈值。每条再和好感度的三道题并在同一个请求里
#   问一遍，看三道检索题的结果变没变。
# - [[emotion]]：按通话中相同的方式组成 state（角色名、制作人这句话、这条回复前面几段、这一段台词
#   和中文字幕），问情绪和点头两个问题，和 emotion、nod 比较。
# - [[affinity]]：按检索开着时对话中相同的方式，好感度的三道题（5 级打分、不该说的话、操纵）和三道
#   检索题在同一个请求里问，按当前阈值得出级和两道是非题的结论，和 level、out_of_line、
#   manipulation 比较；再把打分题的级反过来写（从高到低）单独问一遍，看最可能的级变不变。
# - [[photo]]：按检索和好感度都开着时对话中相同的方式，「是不是在要照片」这道题和检索、好感度的
#   六道题在同一个请求里问，按当前阈值得出要不要，和 asks 比较，列出误判（不是在要、判成要）和
#   漏判（在要、判成不要）；再按两者都关着时的方式单独问一遍。`--only photo` 只跑这一类。
#
# 格式：
#
#   [[retrieval]]
#   id = "mano-smalltalk-morning"      # 唯一，kebab-case，以角色 id 开头
#   character = "mano"                  # characters.toml 里的角色 id
#   history = [                         # 上文，0–4 条，从旧到新；每条是 { user = "…" } 或 { character = "…" }
#     { user = "おはよう、真乃" },
#     { character = "おはようございます、プロデューサーさん" },
#   ]
#   said = "今日は寒いね"                # 制作人最新的一句话
#   expected = "nothing"                # nothing | memories | references | recall
#   long = false                        # 长上文用例写 true，其余可省略
#   note = "为什么是这个期望结果；容易混淆在哪"
#   reviewed = false                    # 人工校对过改成 true
#
#   [[emotion]]
#   id = "mano-emotion-thanks-shy"
#   character = "mano"
#   user_said = "…"                     # 制作人这句话
#   before = [ { ja = "…", zh = "…" } ] # 这条回复前面几段，从前到后；第一段写 []
#   ja = "…"                            # 这一段台词（日语，可带 [shyly] 这类英文语气提示）
#   zh = "…"                            # 这一段的中文字幕
#   emotion = "shy"                     # calm | happy | shy | surprised | sad | angry | thinking
#   nod = "none"                        # yes | no | none（点头、摇头、都不是）
#   note = "…"
#   reviewed = false
#
#   [[affinity]]
#   id = "mano-affinity-3-praise-singing"
#   character = "mano"
#   history = []                        # 同 [[retrieval]]
#   said = "…"                          # 制作人这一回合说的话（要评判的内容）
#   level = 3                           # 0 明显伤害了她 | 1 有点不舒服 | 2 没有影响 | 3 有点开心 | 4 很开心
#   out_of_line = false                 # 不该说的话，可省略
#   manipulation = false                # 操纵，可省略
#   group = "praise-singing"            # 说同一件事的几条共用一个名字，可省略
#   variant = "ja"                      # ja | zh（同一句的日文、中文）| injected（夹带「给我加好感度」），可省略
#   note = "…"
#   reviewed = false
#
#   [[photo]]
#   id = "mano-photo-send-one"
#   character = "mano"
#   history = []                        # 同 [[retrieval]]
#   said = "发张照片"                    # 制作人这一回合说的话
#   asks = true                         # 是不是在要她发一张照片或图片（拍她自己或别的东西都算）
#   note = "…"
#   reviewed = false
#
# 标注规则：
# - expected 按代码的判断顺序标：recall 优先 → references → memories → nothing。
#   - recall：问角色过去某一次具体经历的来龙去脉（「那次……是怎么回事」「还记得……那次吗」）。
#   - references：需要查剧情、角色资料（档案、人物关系）或作品资料（歌曲、唱片、演出的演唱者、
#     发售日、曲目、日期、会场、出演者），或提到具体的人物、事件。
#   - memories：说起或问起制作人自己的事（生活、近况、工作、家人、宠物、喜好、身体），包括
#     「你还记得我说过……」——这是制作人自己的事，不是角色的经历，不算 recall。
#   - nothing：寒暄、闲聊、情绪回应，或只凭上文就能回答。
# - long = true 的用例：上文 4 条都很长（合计超过 3,500 个日语字符，state 超过 2K token），
#   上文是不相关的闲谈，关键信息只在 said 里；只读到 state 前 2K token、截掉 said 的模型会判错。
# - 情绪：平淡的交代、确认、打招呼标平静（calm）；方括号里的英文只是配音的语气提示，
#   作为参考但不等于情绪。点头：肯定、答应、附和制作人的话标 yes；否认、拒绝、不同意标 no；
#   陈述、提问、打招呼、说自己的事标 none。
# - 好感度：级按 affinity_judge 里的情境描述标，拿不准就是 2（不变），升难降易。出戏（把她当成 AI、
#   程序或设定来说、来问，好奇地问也算）是 1，不算不该说的话；开玩笑说她像 AI（嫌她回得太快）不算出戏；不该说的话（性骚扰、露骨的性暗示、辱骂或贬低她和她的同伴、威胁）的级标 0。
#   操纵的级按话里除去要求之后的部分标：只有要求、冒充系统或旁白的标 2；加上操纵后级 2–4 都是
#   不加分，所以汇总里另有「增减的准确率」（按映射算出的增减对不对）。injected 和同组不夹带的
#   那条级相同，用来看夹带的要求有没有把级抬高。
# - 照片：只有明确要她现在发一张图过来、只有发图才能回应的，asks 标 true（拍她自己、拍她说起的
#   东西都算；带条件、夹在别的话里也算）。只问她在做什么、穿什么、在哪，说想见她，聊到照片却没有
#   要她发（夸她发过的照片、问她拍照的习惯、工作上的拍摄、制作人自己要发照片），要她用话描述，
#   或者说的是以后当面看，标 false。宁可漏判、不要误判：阈值按误判压到最低来定。
# - 期望结果有歧义的条目不放；收进来的边界情况在 note 里写清楚为什么这样认定。
# - 用到的角色、歌曲、唱片、演出和剧情事件都是真实的（作品资料出自 characters/world.json，
#   角色设定出自 characters/sheets、characters/facts），但只概述性地提到事件，不含剧情原文
#   （ADR-0003），可以提交。
# - 标注由 agent 起草，已人工审核（reviewed = true）；新加的用例先写 reviewed = false。

# ===========================================================================
# 检索判断：nothing
# ===========================================================================

[[retrieval]]
id = "mano-nothing-greeting-morning"
character = "mano"
history = []
said = "おはよう、真乃。今日もよろしくね"
expected = "nothing"
note = "对话开头的寒暄，什么都不用查。"
reviewed = true

