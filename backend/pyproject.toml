[project]
name = "eidolon"
version = "0.1.0"
description = "Eidolon-SC backend: conversation engine and API"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx[socks]>=0.28.1",
    "loguru>=0.7.3",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pipecat-ai[fish,soniox,webrtc]>=1.12.0",
    "pyrage>=1.4.0",
    "python-socks[asyncio]>=3.1.1",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
eidolon = "eidolon.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyopenjtalk-plus>=0.4.1.post9",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]

[tool.uv]
# pipecat-ai 1.13 还要求 Pillow<13，挡住了 13.0.0 的安全修复。上游已放开（pipecat-ai/pipecat#6286），
# 发版后升 pipecat、删掉这条。pipecat 只在图像帧和视觉服务里用 Pillow，我们不走那些路径
override-dependencies = ["pillow>=13.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 最慢的测试约 5 秒。卡住 30 秒先打出所有线程的调用栈，60 秒算超时：Linux 上只让这个测试失败，
# Windows 没有 SIGALRM，pytest-timeout 打出调用栈后结束整个进程，总之不会一直挂着
faulthandler_timeout = 30
timeout = 60

# 只开 pyflakes 和 pycodestyle 的错误类规则，固定写出来，升级 ruff 时默认规则变了也不会突然多出一批
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 测试从别的测试文件导入 fixture（`mano_call,  # noqa: F401  # the fixture`），
# 再在测试参数里用同名参数接住，pyflakes 会把每个参数都报成重定义
"tests/**" = ["F811"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
